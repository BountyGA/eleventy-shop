name: Build and deploy Eleventy to gh-pages

on:
  push:
    branches: [ "main" ]
  repository_dispatch:
  types: [strapi_update]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build site
        env:
          STRAPI_API_URL: ${{ secrets.STRAPI_API_URL }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
